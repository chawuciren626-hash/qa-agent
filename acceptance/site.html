<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Acceptance | Documents</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#202729;background:#f5f7f7;font:16px system-ui;letter-spacing:0}header{background:#fff;border-bottom:1px solid #ccd4d4;padding:18px 24px}main{max-width:960px;margin:auto;padding:24px}h1{font-size:24px;margin:0}h2{font-size:18px}form{display:flex;gap:16px;align-items:end;flex-wrap:wrap;margin:24px 0}label{display:grid;gap:8px;flex:1;min-width:180px}input,button{font:inherit;padding:10px;border:1px solid #a9b7b6;border-radius:4px}button{background:#146456;color:white;cursor:pointer;min-height:44px}table{border-collapse:collapse;width:100%;background:white}th,td{padding:12px;text-align:left;border-bottom:1px solid #d9dfdf;overflow-wrap:anywhere}th{background:#e7eeee}#message{min-height:28px;color:#8b321e}.table-scroll{overflow:auto}td button{background:#fff;color:#9a3027}small{color:#586866}
</style>
<header><h1>QA Acceptance / Documents</h1></header>
<main><small id="context"></small><h2>Create draft</h2>
<form id="create" novalidate><label>Title<input id="title" autocomplete="off"></label><label>Budget<input id="budget" type="number" value="120"></label><button type="submit">Create</button></form>
<div role="status" id="message" aria-live="polite"></div>
<h2>Documents</h2><div class="table-scroll"><table><thead><tr><th>Title</th><th>Budget</th><th>Status</th><th>Action</th></tr></thead><tbody id="items"></tbody></table></div>
</main>
<script>
const scenario = location.pathname.slice(1);
const scope = new URLSearchParams(location.search).get('scope') || 'manual';
const endpoint = '/api/' + scenario + '/items';
const message = document.querySelector('#message');
document.querySelector('#context').textContent = scenario + ' / ' + scope;
async function call(path, method='GET', body) {
  const response = await fetch(path + '?scope=' + encodeURIComponent(scope), {method, headers:{'content-type':'application/json'},body:body === undefined ? undefined : JSON.stringify(body)});
  const result = await response.json();
  if (!response.ok) throw new Error(result.error);
  return result;
}
async function refresh() {
  const data = await call(endpoint);
  const list = document.querySelector('#items'); list.replaceChildren();
  for (const item of data.items) {
    const row = document.createElement('tr');
    for (const value of [item.title,item.budget,item.status]) { const cell=document.createElement('td');cell.textContent=String(value);row.append(cell); }
    const cell=document.createElement('td');const button=document.createElement('button');button.textContent='Delete';button.setAttribute('aria-label','Delete ' + item.title);
    button.onclick=async()=>{try{await call(endpoint+'/'+item.id,'DELETE');await refresh();message.textContent='Deleted';}catch(error){message.textContent=error.message;}};
    cell.append(button);row.append(cell);list.append(row);
  }
}
document.querySelector('#create').onsubmit=async event=>{
  event.preventDefault();message.textContent='Saving';
  try { const raw=document.querySelector('#budget').value;await call(endpoint,'POST',{title:document.querySelector('#title').value,budget:raw.trim() === '' ? null : Number(raw)});await refresh();message.textContent='Created'; }
  catch(error){message.textContent=error.message;}
};
refresh().catch(error=>message.textContent=error.message);
</script>
</html>
